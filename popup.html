<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云中书</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { width: 248px; margin: 0; padding: 10px; color: #1f2328; background: #fff; }
    h1 { margin: 2px 4px 10px; font-size: 14px; font-weight: 650; }
    button { width: 100%; margin: 3px 0; padding: 9px 10px; border: 1px solid #d0d7de; border-radius: 7px; background: #fff; color: #24292f; text-align: left; cursor: pointer; font: inherit; font-size: 13px; }
    button:hover { background: #f6f8fa; }
    button.primary { border-color: #1f6feb; background: #1f6feb; color: #fff; }
    button.primary:hover { background: #185abd; }
    .icon { display: inline-block; width: 22px; color: #57606a; }
    .primary .icon { color: #fff; }
    #status { min-height: 16px; margin: 6px 4px 0; color: #cf222e; font-size: 11px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>云中书</h1>
  <button id="library"><span class="icon">▤</span>AI 稿件库</button>
  <button class="primary" data-message="web-clip-trigger"><span class="icon">↓</span>剪存当前网页到 WPS</button>
  <button data-message="web-summary-trigger"><span class="icon">✦</span>总结当前网页</button>
  <button id="settings"><span class="icon">⚙</span>插件设置</button>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
